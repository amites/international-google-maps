<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>International Names</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>International Names</h1>
      <p>Use Lake Ontario and Gulf of Mexico in Google Maps.</p>
      <label class="toggle" for="enabled">
        <input id="enabled" type="checkbox" />
        <span>Enable replacements</span>
      </label>
      <p class="note">Map labels are visually replaced with an overlay that follows the map as you pan and zoom.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
